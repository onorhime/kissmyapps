# The app SDKs: React Native (tests and types), Android (the JVM core's tests, then the
# library itself), iOS (tests on macOS, then a build for iOS devices) and Flutter (tests on
# the oldest and newest Flutter it supports, then the example app built for Android and iOS).
name: Mobile SDKs

on:
  pull_request:
    paths:
      - 'integrations/analytics-mobile/**'
      - 'integrations/analytics-react-native/**'
      - '.github/workflows/mobile-sdks.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/analytics-mobile/**'
      - 'integrations/analytics-react-native/**'
      - '.github/workflows/mobile-sdks.yml'

jobs:
  react-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile-sdk:check
      - run: pnpm exec vitest run integrations/analytics-react-native

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/analytics-mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the core
        run: ./gradlew -p core test
      - name: Build the library as JitPack does
        run: ./gradlew :kissmyapps:assembleRelease :kissmyapps:publishReleasePublicationToMavenLocal

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: integrations/analytics-mobile
    steps:
      - uses: actions/checkout@v4
      - name: Test on macOS
        run: swift test
      - name: Build for iOS
        run: xcodebuild build -scheme KissMyApps -destination 'generic/platform=iOS Simulator' -quiet

  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Flutter the package supports, and the newest.
        flutter: ['3.24.5', 'stable']
    defaults:
      run:
        working-directory: integrations/analytics-mobile/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter ${{ matrix.flutter }}
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch ${{ matrix.flutter }} https://github.com/flutter/flutter.git
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get && (cd example && flutter pub get)
      - name: Check formatting
        if: matrix.flutter == 'stable'
        run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Check the package as pub.dev will
        if: matrix.flutter == 'stable'
        run: flutter pub publish --dry-run

  flutter-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/analytics-mobile/flutter/example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Make the example's Android project
        run: flutter create --platforms=android --org com.kissmyapps --project-name kissmyapps_example . && rm -rf test
      - name: Build the example app
        run: flutter build apk --debug

  flutter-ios:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        packages: [swift-package-manager, cocoapods]
    defaults:
      run:
        working-directory: integrations/analytics-mobile/flutter/example
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Use ${{ matrix.packages }}
        run: |
          if [ "${{ matrix.packages }}" = swift-package-manager ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi
      - name: Make the example's iOS project
        run: flutter create --platforms=ios --org com.kissmyapps --project-name kissmyapps_example . && rm -rf test
      - name: Build the example app for the simulator
        run: flutter build ios --simulator --debug
