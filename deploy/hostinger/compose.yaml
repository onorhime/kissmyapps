name: kissmyapps-dashboard

services:
  dashboard:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    pull_policy: never
    container_name: kissmyapps-dashboard
    restart: unless-stopped
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    user: '65532:65532'
    expose:
      - '8080'
    volumes:
      - /srv/kissmyapps/current/dist:/srv:ro
      - /srv/kissmyapps/deploy/dashboard.Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config:uid=65532,gid=65532,mode=0700,size=16m,noexec,nosuid,nodev
      - /data:uid=65532,gid=65532,mode=0700,size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - application

  # The events relay: the edge Caddy sends SDK traffic here, and it adds the visitor's
  # place from DB-IP's city database before passing it on to analytics-ingest. It keeps
  # that database in /data and refreshes it monthly. See deploy/geo-relay/server.mjs.
  geo:
    image: node:22.23.4-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    pull_policy: never
    container_name: kissmyapps-geo
    restart: unless-stopped
    command:
      - node
      - /app/server.mjs
    user: '1000:1000'
    expose:
      - '8787'
    environment:
      KMA_INGEST_URL: https://mmyruzjemjecqyivhrgr.supabase.co/functions/v1/analytics-ingest
      KMA_GEO_DATABASE: /data/dbip-city-lite.mmdb
      NODE_ENV: production
    # Holds KMA_ANALYTICS_PROXY_SECRET only; root-owned, mode 600, never committed.
    env_file:
      - /srv/kissmyapps/geo-relay.env
    volumes:
      - /srv/kissmyapps/deploy/geo-relay:/app:ro
      - /srv/kissmyapps/geo-data:/data
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700,size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The database is about 120 MB on disk and is held in memory, twice while a new
    # month's file is checked before the swap.
    mem_limit: 640m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - application

networks:
  application:
    external: true
    name: dramapal_application
