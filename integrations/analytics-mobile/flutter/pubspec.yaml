name: kissmyapps
description: >-
  Analytics for Flutter apps: installs, updates, opens, sessions, screens and your own
  events, sent to your KissMyApps dashboard. Offline queue, no third-party dependencies.
version: 1.0.0
homepage: https://kissmyapps.dev
repository: https://github.com/onorhime/kissmyapps-mobile/tree/main/flutter
issue_tracker: https://github.com/onorhime/kissmyapps-mobile/issues
topics:
  - analytics
  - tracking
  - events
  - mobile-analytics
  - sessions

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.kissmyapps.flutter
        pluginClass: KissMyAppsPlugin
      ios:
        pluginClass: KissMyAppsPlugin
