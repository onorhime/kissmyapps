// The Android side of the KissMyApps Flutter plugin: device details over a method channel,
// the Google Play install referrer, and the App Links that open the app. Plain Java, so it
// builds with any Android Gradle plugin and Kotlin setup the app has. No advertising ID.
group = "com.kissmyapps.flutter"
version = "1.1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.kissmyapps.flutter"
    compileSdk = 35

    defaultConfig {
        minSdk = 21
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    implementation("com.android.installreferrer:installreferrer:2.2")
}
