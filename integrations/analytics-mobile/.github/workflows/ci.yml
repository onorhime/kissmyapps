# Runs in the public kissmyapps-mobile repository, where this folder is the root. In the
# KissMyApps monorepo the same checks run from .github/workflows/mobile-sdks.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the core
        run: ./gradlew -p core test
      - name: Build the library as JitPack does
        run: ./gradlew :kissmyapps:assembleRelease :kissmyapps:publishReleasePublicationToMavenLocal

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test on macOS
        run: swift test
      - name: Build for iOS
        run: xcodebuild build -scheme KissMyApps -destination 'generic/platform=iOS Simulator' -quiet

  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Flutter the package supports, and the newest.
        flutter: ['3.24.5', 'stable']
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter ${{ matrix.flutter }}
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch ${{ matrix.flutter }} https://github.com/flutter/flutter.git
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get && (cd example && flutter pub get)
      - name: Check formatting
        if: matrix.flutter == 'stable'
        run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Check the package as pub.dev will
        if: matrix.flutter == 'stable'
        run: flutter pub publish --dry-run

  flutter-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Make the example's Android project
        run: flutter create --platforms=android --org com.kissmyapps --project-name kissmyapps_example . && rm -rf test
      - name: Build the example app
        run: flutter build apk --debug

  flutter-ios:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        packages: [swift-package-manager, cocoapods]
    defaults:
      run:
        working-directory: flutter/example
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Use ${{ matrix.packages }}
        run: |
          if [ "${{ matrix.packages }}" = swift-package-manager ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi
      - name: Make the example's iOS project
        run: flutter create --platforms=ios --org com.kissmyapps --project-name kissmyapps_example . && rm -rf test
      - name: Build the example app for the simulator
        run: flutter build ios --simulator --debug
